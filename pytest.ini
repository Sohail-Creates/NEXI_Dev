[pytest]
# Pytest configuration for NEXI project

# Minimum version
minversion = 7.0

# Python files
python_files = test_*.py *_test.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Test paths to collect
testpaths = 
    tests
    .
    01_central_server
    02_vision_service
    03_audio_service
    04_tts_service
    05_teachme_service
    06_enrollment_service
    07_llm_service

# Ignore patterns
norecursedirs = 
    .git
    .pytest_cache
    __pycache__
    .venv
    venv
    node_modules
    build
    dist
    *.egg-info

# Strict markers (fail on unknown markers)
addopts = 
    --import-mode=importlib
    --strict-markers
    --strict-config
    -v
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Coverage options (when using pytest-cov)
# addopts = --cov=/path/to/source --cov-report=html --cov-report=term-missing

# Asyncio mode for async tests
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, service interaction)
    security: Security-focused tests
    performance: Performance/benchmark tests
    slow: Slow tests (skipped by default with -m'not slow')

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Console options
console_output_style = progress

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning


