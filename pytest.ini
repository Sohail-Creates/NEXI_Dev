[pytest]
# Pytest configuration for NEXI project
# Full Phase 8 pyramid: .\venv\Scripts\python.exe -m pytest

# Minimum version
minversion = 7.0

# Python files
python_files = test_*.py *_test.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Test paths to collect
testpaths = 
    tests

# Ignore patterns
norecursedirs = 
    .git
    .pytest_cache
    __pycache__
    .venv
    venv
    node_modules
    build
    dist
    *.egg-info

# Strict markers (fail on unknown markers)
addopts = 
    --import-mode=importlib
    --strict-markers
    --strict-config
    -m "not design_reference and not hardware"
    -v
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Coverage options (when using pytest-cov)
# addopts = --cov=/path/to/source --cov-report=html --cov-report=term-missing

# Asyncio mode for async tests
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    contract: Producer/consumer API contract tests
    integration: Integration tests (slower, service interaction)
    resilience: Failure, restart, and recovery tests
    e2e: Full user-journey tests
    design_reference: Non-production architecture reference; excluded from regression gates
    hardware: Requires physical microphone, webcam, model weights, or paid provider access
    security: Security-focused tests
    performance: Performance/benchmark tests
    slow: Slow tests (skipped by default with -m'not slow')

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Console options
console_output_style = progress

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning


