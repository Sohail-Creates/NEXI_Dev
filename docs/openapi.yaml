openapi: 3.0.0
info:
  title: NEXI Robot Control System API
  version: 2.0.0
  description: Comprehensive API for NEXI robot with security hardening, rate limiting, and optimizations
  contact:
    name: NEXI Development Team
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Central Server (Local)
  - url: http://nexi.local:8000
    description: Central Server (Network)

# ============================================================================
# COMPONENTS
# ============================================================================

components:
  schemas:
    # ========== REQUEST MODELS ==========
    QueryRequest:
      type: object
      required:
        - text
        - user_id
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: User query or command
        user_id:
          type: string
          minLength: 1
          description: User identifier
        language:
          type: string
          enum: [english, urdu, spanish]
          default: english
          description: Query language
      example:
        text: "What is the weather today?"
        user_id: "sara_001"
        language: "english"

    LLMGenerateRequest:
      type: object
      required:
        - prompt
        - user_id
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
          description: Prompt for LLM
        max_tokens:
          type: integer
          minimum: 10
          maximum: 512
          default: 256
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 0.95
        user_id:
          type: string
          description: User identifier

    UserProfile:
      type: object
      required:
        - user_id
        - username
        - age
      properties:
        user_id:
          type: string
          description: Unique user identifier
        username:
          type: string
          description: Display name
        age:
          type: integer
          minimum: 13
          maximum: 120
        language:
          type: string
          enum: [english, urdu, spanish]
        preferences:
          type: object
          additionalProperties: true

    EnrollmentRequest:
      type: object
      required:
        - username
        - age
      properties:
        username:
          type: string
          minLength: 1
        age:
          type: integer
          minimum: 13
          maximum: 120
        language:
          type: string
          enum: [english, urdu]
        photo:
          type: string
          format: binary
          description: Profile photo
        voice:
          type: string
          format: binary
          description: Voice sample

    # ========== RESPONSE MODELS ==========
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    QueryResponse:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: string
          description: Generated response text
        confidence:
          type: number
          minimum: 0
          maximum: 1
        processing_time_ms:
          type: integer
        context:
          type: object
          properties:
            emotion:
              type: string
            intent:
              type: string
            knowledge_used:
              type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        timestamp:
          type: string
          format: date-time

    RateLimitError:
      type: object
      properties:
        detail:
          type: string
        retry_after:
          type: integer
          description: Seconds to wait before retrying
        limit:
          type: integer
          description: Request limit
        window:
          type: string
          description: Time window (e.g., '1 minute')

  responses:
    # ========== STANDARD RESPONSES ==========
    Success200:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object

    Created201:
      description: Resource created
      content:
        application/json:
          schema:
            type: object

    BadRequest400:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized401:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited429:
      description: Too many requests (rate limit exceeded)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying

    ServerError500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

# ============================================================================
# PATHS
# ============================================================================

paths:
  /:
    get:
      summary: Root endpoint
      description: Returns API status
      tags:
        - Health
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string

  /health:
    get:
      summary: Health check
      description: |
        Service health status endpoint. Always available (exempt from rate limiting).
        Used for monitoring and load balancer health checks.
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
          $ref: '#/components/responses/ServerError500'

  /api/v1/query:
    post:
      summary: User query/command
      description: |
        Process user query and generate response with context awareness.
        
        **Rate Limit:** 100 requests/minute per user
        
        **Process:**
        1. Validate input (XSS, injection prevention)
        2. Check rate limit
        3. Build context (vision, audio, knowledge)
        4. Generate response (LLM)
        5. Convert to speech (TTS)
        6. Return response
      operationId: processQuery
      tags:
        - Query
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '500':
          $ref: '#/components/responses/ServerError500'

  /api/v1/user/{user_id}:
    get:
      summary: Get user profile
      description: Retrieve user profile information
      operationId: getUser
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          $ref: '#/components/responses/ServerError500'

    delete:
      summary: Delete user
      description: Delete user profile and all associated data
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deleted successfully
        '404':
          description: User not found
        '429':
          $ref: '#/components/responses/RateLimited429'

  /api/v1/enroll:
    post:
      summary: Start user enrollment
      description: |
        Start new user enrollment process. Validates photos and voice samples.
        
        **Rate Limit:** 5 requests / 5 minutes (sensitive operation)
        
        **Process:**
        1. Validate user data
        2. Process photo (face detection)
        3. Process voice sample (speaker verification)
        4. Create user embeddings
        5. Register with central server
      operationId: startEnrollment
      tags:
        - Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created201'
        '400':
          description: Invalid enrollment data
          $ref: '#/components/responses/BadRequest400'
        '429':
          description: Rate limit exceeded (5 per 5 minutes)
          $ref: '#/components/responses/RateLimited429'

  /api/v1/llm/generate:
    post:
      summary: Generate text using LLM
      description: |
        Generate response using quantized LLM model (SmolLM2 1.7B with 8-bit quantization).
        
        **Rate Limit:** 10 requests/minute (expensive operation)
        
        **Parameters:**
        - max_tokens: Output length (default: 256)
        - temperature: Creativity level (0-2, default: 0.7)
        - top_p: Diversity parameter (default: 0.95)
        
        **Timeout:** 15 seconds (returns fallback if exceeded)
      operationId: generateText
      tags:
        - LLM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMGenerateRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Text generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_text:
                    type: string
                  tokens_used:
                    type: integer
                  processing_time_ms:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest400'
        '429':
          description: Rate limit exceeded (10 per minute)
          $ref: '#/components/responses/RateLimited429'
        '504':
          description: LLM inference timeout (>15s)
          $ref: '#/components/responses/ServerError500'

  # ========== VISION SERVICE ENDPOINTS ==========
  /api/v1/vision/extract-embedding:
    post:
      summary: Extract face embedding
      description: Extract face embedding from image
      operationId: extractFaceEmbedding
      tags:
        - Vision
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Embedding extracted
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedding:
                    type: array
                    items:
                      type: number
                  confidence:
                    type: number

  # ========== AUDIO SERVICE ENDPOINTS ==========
  /api/v1/audio/embedding:
    post:
      summary: Extract voice embedding
      description: Extract voice embedding from audio
      operationId: extractVoiceEmbedding
      tags:
        - Audio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Voice embedding extracted
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedding:
                    type: array
                    items:
                      type: number
                  confidence:
                    type: number

  # ========== TTS SERVICE ENDPOINTS ==========
  /api/v1/tts/synthesize:
    post:
      summary: Text to speech synthesis
      description: Convert text to speech
      operationId: synthesizeText
      tags:
        - TTS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                voice:
                  type: string
                  enum: [ryan, jessica, shahid]
                language:
                  type: string
                  enum: [english, urdu]
      responses:
        '200':
          description: Audio synthesized
          content:
            audio/wav:
              schema:
                type: string
                format: binary

  # ========== TEACHME SERVICE ENDPOINTS ==========
  /api/v1/teachme/learn:
    post:
      summary: Learn new object
      description: Teach robot about new object or concept
      operationId: learnObject
      tags:
        - TeachMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object_name:
                  type: string
                description:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Object learned
          $ref: '#/components/responses/Created201'

  /api/v1/teachme/recognize:
    post:
      summary: Recognize object
      description: Identify learned object from image
      operationId: recognizeObject
      tags:
        - TeachMe
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Object recognized
          content:
            application/json:
              schema:
                type: object
                properties:
                  object_name:
                    type: string
                  confidence:
                    type: number

# ============================================================================
# TAGS
# ============================================================================

tags:
  - name: Health
    description: Service health checks
  - name: Query
    description: User query processing
  - name: Users
    description: User profile management
  - name: Enrollment
    description: User enrollment workflow
  - name: LLM
    description: Language model operations
  - name: Vision
    description: Vision service operations
  - name: Audio
    description: Audio service operations
  - name: TTS
    description: Text-to-speech operations
  - name: TeachMe
    description: Knowledge learning operations

# ============================================================================
# SECURITY
# ============================================================================

security:
  - bearerAuth: []

# ============================================================================
# METADATA
# ============================================================================

x-nexi-metadata:
  phase: "2.0 (Production)"
  optimization_level: "9.5/10"
  rate_limits:
    default: "100 requests/minute per user"
    llm: "10 requests/minute"
    enrollment: "5 requests/5 minutes"
    health: "unlimited (exempt)"
  timeouts:
    vision: "5 seconds"
    audio: "5 seconds"
    tts: "10 seconds"
    llm: "15 seconds"
    enrollment: "30 seconds"
  features:
    - "Rate limiting (token bucket)"
    - "Input validation (XSS, injection prevention)"
    - "Quantized LLM (8-bit, 2-3x faster)"
    - "Context awareness"
    - "Multi-language support"
    - "Error recovery"
    - "Service monitoring"
