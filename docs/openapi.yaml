  /users/enroll-complete:
    post:
      tags:
      - User Management
      summary: Enroll User Complete
      description: "Complete user enrollment with audio samples (from Streamlit app.py).\n\
        \nTHIS IS THE PRIMARY ENDPOINT FOR STREAMLIT INTEGRATION.\n\nFlow:\n1. Receives\
        \ multipart audio files from Streamlit\n2. Calls Audio Service via audio_client.enroll_speaker()\
        \ to extract embeddings\n3. Stores user with real embeddings in Central Server\n\
        4. Returns user_id and enrollment confirmation\n\nArgs:\n    user_name: User's\
        \ full name\n    age: User's age (optional)\n    relation: User's relation\
        \ (optional)\n    audio_samples: List of uploaded audio files (WAV/MP3)\n\
        \    request: FastAPI request context for accessing app state\n\nReturns:\n\
        \    {\n        \"success\": true,\n        \"data\": {\n            \"user_id\"\
        : \"user_xyz\",\n            \"name\": \"John Doe\",\n            \"enrolled_with\"\
        : 5,\n            \"embeddings_count\": 5,\n            \"enrollment_timestamp\"\
        : \"2026-02-10T12:34:56\"\n        },\n        \"message\": \"User enrolled\
        \ successfully\"\n    }"
      operationId: enroll_user_complete_users_enroll_complete_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_enroll_user_complete_users_enroll_complete_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
