components:
  schemas:
    Body_create_voice_session_users_session_voice_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_create_voice_session_users_session_voice_post
    Body_enroll_user_complete_users_enroll_complete_post:
      properties:
        user_name:
          type: string
          title: User Name
        age:
          anyOf:
          - type: string
          - type: 'null'
          title: Age
        relation:
          anyOf:
          - type: string
          - type: 'null'
          title: Relation
        audio_samples:
          items: {}
          type: array
          title: Audio Samples
      type: object
      required:
      - user_name
      - audio_samples
      title: Body_enroll_user_complete_users_enroll_complete_post
    Body_register_user_users_register_post:
      properties:
        name:
          type: string
          title: Name
        audio_file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Audio File
        photo_file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Photo File
        user_name:
          type: string
          title: User Name
        user_email:
          type: string
          title: User Email
      type: object
      title: Body_register_user_users_register_post
    Body_register_user_with_voice_users_register_with_voice_post:
      properties:
        name:
          type: string
          title: Name
        email:
          type: string
          title: Email
        audio_sample1:
          type: string
          format: binary
          title: Audio Sample1
        audio_sample2:
          type: string
          format: binary
          title: Audio Sample2
        audio_sample3:
          type: string
          format: binary
          title: Audio Sample3
      type: object
      required:
      - name
      - email
      - audio_sample1
      - audio_sample2
      - audio_sample3
      title: Body_register_user_with_voice_users_register_with_voice_post
    CallRequest:
      properties:
        call_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          title: Call Id
      type: object
      required:
      - call_id
      title: CallRequest
    CameraRequest:
      properties:
        service_name:
          type: string
          title: Service Name
        timeout:
          type: integer
          title: Timeout
          default: 30
        lease_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Lease Id
      type: object
      required:
      - service_name
      title: CameraRequest
    EmbeddingSearchRequest:
      properties:
        query:
          type: string
          maxLength: 200
          minLength: 1
          title: Query
        k:
          type: integer
          title: K
          default: 5
        threshold:
          type: number
          title: Threshold
          default: 0.3
      type: object
      required:
      - query
      title: EmbeddingSearchRequest
      description: Embedding-based search request
    FactData:
      properties:
        subject:
          type: string
          title: Subject
        predicate:
          type: string
          title: Predicate
        object:
          type: string
          title: Object
        context:
          additionalProperties: true
          type: object
          title: Context
      type: object
      required:
      - subject
      - predicate
      - object
      title: FactData
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LearningRequest:
      properties:
        type:
          type: string
          enum:
          - object
          - fact
          title: Type
        data:
          anyOf:
          - $ref: '#/components/schemas/ObjectData'
          - $ref: '#/components/schemas/FactData'
          title: Data
        tags:
          items:
            type: string
          type: array
          title: Tags
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 1.0
      type: object
      required:
      - type
      - data
      title: LearningRequest
      description: Mirror TeachMe's typed public learning contract.
    ObjectData:
      properties:
        name:
          type: string
          title: Name
        attributes:
          additionalProperties: true
          type: object
          title: Attributes
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - name
      title: ObjectData
    RAGQueryRequest:
      properties:
        query:
          type: string
          maxLength: 2000
          minLength: 1
          title: Query
      additionalProperties: false
      type: object
      required:
      - query
      title: RAGQueryRequest
    SyncRequest:
      properties:
        service_name:
          type: string
          title: Service Name
        items:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Items
      type: object
      required:
      - service_name
      - items
      title: SyncRequest
      description: Knowledge sync request
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ErrorBody:
      type: object
      required:
      - status_code
      - code
      - message
      - request_id
      properties:
        status_code:
          type: integer
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
servers:
- url: http://localhost:8000
  description: Local service
